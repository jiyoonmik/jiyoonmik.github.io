<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Retrieval flow: BM25 plus vector search</title>
  <desc id="desc">A query is sent to both BM25 keyword search and dense vector search. The two ranked result lists are merged by alpha weighted fusion into one final ranking.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/>
    </marker>
    <linearGradient id="fusion" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" rx="0" fill="#f8fafc"/>
  <path d="M0 610 C180 560 280 690 460 620 C610 562 750 574 900 625 C1060 682 1160 596 1280 640 L1280 720 L0 720 Z" fill="#e9f1f5"/>

  <text x="80" y="86" font-family="Inter, Pretendard, Arial, sans-serif" font-size="38" font-weight="800" fill="#14213d">Hybrid Retrieval = BM25 + Vector</text>
  <text x="80" y="124" font-family="Inter, Pretendard, Arial, sans-serif" font-size="20" fill="#52627a">키워드 정확도와 의미 유사도를 함께 사용해 최종 랭킹을 만든다</text>

  <g filter="url(#shadow)">
    <rect x="92" y="250" width="210" height="120" rx="18" fill="#ffffff"/>
    <text x="197" y="300" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="22" font-weight="800" fill="#14213d">Query</text>
    <text x="197" y="334" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">분수의 약분과 통분</text>
  </g>

  <path d="M302 292 C374 250 420 222 498 214" fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M302 328 C374 392 420 440 498 456" fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="510" y="156" width="270" height="172" rx="20" fill="#ffffff"/>
    <rect x="536" y="184" width="92" height="40" rx="10" fill="#e0f2fe"/>
    <text x="582" y="211" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">BM25</text>
    <text x="536" y="260" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#14213d">Keyword search</text>
    <text x="536" y="292" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" fill="#52627a">표면 토큰, 정확 일치, 희귀 용어</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="392" width="270" height="172" rx="20" fill="#ffffff"/>
    <rect x="536" y="420" width="108" height="40" rx="10" fill="#dcfce7"/>
    <text x="590" y="447" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d">Vector</text>
    <text x="536" y="496" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#14213d">Semantic search</text>
    <text x="536" y="528" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" fill="#52627a">문장 의미, 패러프레이즈, 유사 개념</text>
  </g>

  <path d="M780 240 C834 252 862 276 910 322" fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M780 480 C834 466 862 430 910 382" fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="910" y="270" width="220" height="164" rx="22" fill="url(#fusion)"/>
    <text x="1020" y="326" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="26" font-weight="850" fill="#ffffff">Fusion</text>
    <text x="1020" y="366" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">alpha = 0.5</text>
    <text x="1020" y="398" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" fill="#fff7ed">normalized score + ranking</text>
  </g>

  <path d="M1130 352 C1170 352 1190 352 1210 352" fill="none" stroke="#52627a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="970" y="500" width="220" height="88" rx="18" fill="#ffffff"/>
    <text x="1080" y="536" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="19" font-weight="800" fill="#14213d">Final ranking</text>
    <text x="1080" y="568" text-anchor="middle" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17" fill="#52627a">두 검색 신호를 합친 결과</text>
  </g>

  <g transform="translate(1168 290)">
    <rect x="0" y="0" width="24" height="124" rx="12" fill="#dbeafe"/>
    <rect x="38" y="0" width="24" height="124" rx="12" fill="#ccfbf1"/>
    <rect x="76" y="0" width="24" height="124" rx="12" fill="#fed7aa"/>
  </g>

  <text x="80" y="662" font-family="Inter, Pretendard, Arial, sans-serif" font-size="16" fill="#64748b">Based on Weaviate hybrid search concepts: vector search + keyword search (BM25) + fusion + alpha weighting</text>
</svg>
