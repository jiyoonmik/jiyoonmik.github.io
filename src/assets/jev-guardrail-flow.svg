<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Jev를 LLM 출력 검사기로 두는 가드레일 흐름</title>
  <desc id="desc">LLM이 만든 답변을 고객 질문과 함께 Jev가 검사하고, 판정 코드가 PASS, RETRY, HUMAN, BLOCK 중 하나로 보낸다. RETRY는 피드백을 붙여 LLM으로 되돌아가며 최대 두 번까지 반복한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52647a"/>
    </marker>
    <marker id="arrow-retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a1f"/>
    </marker>
    <style>
      .box { rx: 18; stroke-width: 2; }
      .label { font: 700 24px sans-serif; fill: #172033; text-anchor: middle; }
      .sub { font: 400 17px sans-serif; fill: #46556b; text-anchor: middle; }
      .arrow { fill: none; stroke: #52647a; stroke-width: 3; marker-end: url(#arrow); }
      .retry { fill: none; stroke: #c98a1f; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-retry); }
      .small { font: 600 16px sans-serif; fill: #52647a; text-anchor: middle; }
      .small-retry { font: 600 16px sans-serif; fill: #a86f12; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f9fc"/>
  <text x="600" y="48" class="label">LLM이 쓰고, Jev가 검사하고, 코드가 판정한다</text>

  <rect class="box" x="40" y="205" width="170" height="110" fill="#ffffff" stroke="#b8c6d8"/>
  <text x="125" y="252" class="label">고객 질문</text>
  <text x="125" y="284" class="sub">question</text>

  <rect class="box" x="270" y="195" width="200" height="130" fill="#f0eaff" stroke="#a28ad8"/>
  <text x="370" y="246" class="label">LLM 생성</text>
  <text x="370" y="278" class="sub">답변 초안</text>
  <text x="370" y="302" class="sub">≈ 1.5 s</text>

  <rect class="box" x="530" y="175" width="220" height="170" fill="#e8f2ff" stroke="#76a9e8"/>
  <text x="640" y="222" class="label">Jev 검사</text>
  <text x="640" y="256" class="sub">질문 + 답변을 state로</text>
  <text x="640" y="282" class="sub">relevant · risky · tone</text>
  <text x="640" y="310" class="sub">≈ 0.2 s</text>

  <rect class="box" x="810" y="195" width="150" height="130" fill="#fff4db" stroke="#e8bd61"/>
  <text x="885" y="250" class="label">판정 코드</text>
  <text x="885" y="282" class="sub">verdict()</text>

  <rect class="box" x="1015" y="78" width="150" height="76" fill="#e8f7ee" stroke="#74bd8b"/>
  <text x="1090" y="111" class="label">PASS</text>
  <text x="1090" y="137" class="sub">그대로 발송</text>

  <rect class="box" x="1015" y="182" width="150" height="76" fill="#fff4db" stroke="#e8bd61"/>
  <text x="1090" y="215" class="label">RETRY</text>
  <text x="1090" y="241" class="sub">피드백 후 재생성</text>

  <rect class="box" x="1015" y="286" width="150" height="76" fill="#eef1f6" stroke="#9aa9bd"/>
  <text x="1090" y="319" class="label">HUMAN</text>
  <text x="1090" y="345" class="sub">검토 큐</text>

  <rect class="box" x="1015" y="390" width="150" height="76" fill="#fff0ef" stroke="#dc918a"/>
  <text x="1090" y="423" class="label">BLOCK</text>
  <text x="1090" y="449" class="sub">차단 · 알림</text>

  <path class="arrow" d="M210 260 H260"/>
  <path class="arrow" d="M470 260 H520"/>
  <path class="arrow" d="M750 260 H800"/>
  <path class="arrow" d="M960 230 C985 200 985 116 1005 116"/>
  <path class="arrow" d="M960 245 C985 235 990 220 1005 220"/>
  <path class="arrow" d="M960 275 C985 285 990 324 1005 324"/>
  <path class="arrow" d="M960 290 C985 320 985 428 1005 428"/>

  <path class="retry" d="M885 195 V140 H370 V185"/>
  <text x="628" y="128" class="small-retry">RETRY: 문제를 지시문으로 바꿔 다시 생성 (최대 2회)</text>
</svg>
