<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Weaviate와 Neo4j, LatticeDB 구성 비교</title>
  <desc id="desc">흰 배경의 흑백 펜 스케치. 왼쪽에서 애플리케이션이 Weaviate에 벡터 검색을 요청해 후보 ID를 받고, 그 ID로 Neo4j의 관계를 조회한다. 두 데이터베이스 사이에는 직접 연결이 없다. 오른쪽에는 그래프·벡터·전문 검색을 담은 하나의 LatticeDB 파일이 있다.</desc>
  <defs>
    <style>
      .ink { fill: none; stroke: #202020; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #202020; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill { fill: #fff; stroke: #202020; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .title { font: 700 34px sans-serif; fill: #171717; text-anchor: middle; }
      .label { font: 700 24px sans-serif; fill: #171717; text-anchor: middle; }
      .sub { font: 500 18px sans-serif; fill: #353535; text-anchor: middle; }
      .note { font: 600 19px sans-serif; fill: #353535; text-anchor: middle; }
      .flow { fill: none; stroke: #202020; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="700" y="64" class="title">두 데이터베이스를 연결하는 방식과 한 파일에 담는 방식</text>

  <g transform="rotate(-2 170 250)">
    <rect class="fill" x="75" y="163" width="205" height="154" rx="14"/>
    <path class="thin" d="M87 200 Q170 192 268 202 M88 248 Q178 239 268 249 M88 294 Q172 287 267 296"/>
    <circle class="ink" cx="102" cy="181" r="5"/>
    <circle class="ink" cx="102" cy="229" r="5"/>
    <circle class="ink" cx="102" cy="276" r="5"/>
    <text x="179" y="224" class="label">Weaviate</text>
    <text x="179" y="270" class="sub">벡터 · BM25 검색</text>
  </g>

  <g transform="rotate(2 422 245)">
    <rect class="fill" x="330" y="163" width="205" height="154" rx="14"/>
    <path class="thin" d="M342 200 Q433 207 523 198 M342 248 Q431 256 523 247 M342 294 Q428 301 523 293"/>
    <circle class="ink" cx="359" cy="181" r="5"/>
    <circle class="ink" cx="359" cy="229" r="5"/>
    <circle class="ink" cx="359" cy="276" r="5"/>
    <text x="435" y="224" class="label">Neo4j</text>
    <text x="435" y="270" class="sub">그래프 탐색</text>
  </g>

  <g transform="rotate(-1 293 527)">
    <rect class="fill" x="182" y="472" width="242" height="112" rx="18"/>
    <text x="303" y="518" class="label">애플리케이션</text>
    <text x="303" y="551" class="sub">동기화 · 결과 연결</text>
  </g>
  <path class="flow" d="M219 468 C190 423 150 372 137 322"/>
  <path class="flow" d="M239 322 C267 370 279 419 278 468"/>
  <path class="flow" d="M387 468 C416 423 456 372 469 322"/>
  <path class="flow" d="M367 322 C339 370 327 419 328 468"/>
  <text x="300" y="645" class="note">앱이 벡터 후보를 찾고 ID로 그래프를 조회</text>

  <path class="ink" d="M590 370 Q662 353 733 370"/>
  <path class="ink" d="M709 346 Q727 361 745 370 Q725 383 709 398"/>
  <text x="668" y="330" class="note">한 엔진으로</text>

  <g transform="rotate(1 1055 385)">
    <path class="fill" d="M902 190 Q900 178 918 178 L1110 178 Q1124 178 1124 193 L1124 578 Q1123 592 1108 592 L918 592 Q902 592 902 577 Z"/>
    <path class="ink" d="M946 178 L946 592"/>
    <path class="ink" d="M918 270 Q931 261 946 270 M918 383 Q931 374 946 383 M918 496 Q931 487 946 496"/>
    <path class="thin" d="M976 236 Q1039 230 1091 238 M977 259 Q1034 254 1085 261"/>
    <text x="1034" y="224" class="label">LatticeDB</text>
    <g transform="translate(977 300)">
      <circle class="fill" cx="24" cy="31" r="13"/>
      <circle class="fill" cx="92" cy="16" r="13"/>
      <circle class="fill" cx="87" cy="70" r="13"/>
      <path class="ink" d="M37 28 L78 19 M35 39 L75 64 M91 29 L88 57"/>
      <text x="148" y="38" class="sub">그래프</text>
    </g>
    <g transform="translate(978 399)">
      <path class="ink" d="M5 21 Q19 7 33 21 T61 21 T89 21 M5 43 Q19 29 33 43 T61 43 T89 43 M5 65 Q19 51 33 65 T61 65 T89 65"/>
      <text x="148" y="48" class="sub">벡터 검색</text>
    </g>
    <g transform="translate(980 500)">
      <path class="ink" d="M10 10 L86 10 M10 31 L78 31 M10 52 L84 52"/>
      <text x="148" y="39" class="sub">BM25 전문 검색</text>
    </g>
  </g>
  <text x="1044" y="645" class="note">앱 안에서 여는 데이터베이스 파일 하나</text>
</svg>
